<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaraOkay — sing along to anything</title>
<meta name="description" content="Search a song, grab the mic, and sing along with synced lyrics.">
<meta name="theme-color" content="#70c5e7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#72c9e9; --panel:#f8fbff; --line:#1d263d;
  --pink:#c91232; --cyan:#087ea4; --yellow:#f4c845; --purple:#1b2945; --text:#17233b; --dim:#64728c;
  --font:'Space Grotesk',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;overflow-x:hidden;
  background-image:radial-gradient(rgba(255,255,255,.34) .7px,transparent .7px);background-size:5px 5px}
button,input{font-family:inherit}

/* ---------- understated karaoke-console background ---------- */
.lights{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.13),transparent 44%),#72c9e9}
.beam,.stars{display:none}

/* ---------- header / logo ---------- */
#top{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px;transition:padding .3s}
body[data-view=home] #top{padding:36px 16px 24px}
.logo{font-family:var(--font);font-size:28px;line-height:1;margin:0;cursor:pointer;letter-spacing:-1.8px;user-select:none;transition:font-size .3s;white-space:nowrap;font-weight:700;color:#17233b}
.logo .a,.logo .b{color:inherit;text-shadow:none;animation:none}
body[data-view=home] .logo{font-size:clamp(36px,7vw,58px)}
.tag{margin:0;color:#34435d;font-size:clamp(14px,2.4vw,17px);text-align:center;display:none}
body[data-view=home] .tag{display:block}
#sf{display:flex;gap:8px;width:100%;max-width:640px}
body[data-view=stage] #sf,body[data-view=stage] .chips{display:none}
#q{flex:1;min-width:0;padding:13px 17px;border-radius:8px;border:1px solid #263650;background:#fff;color:#17233b;font-size:15px;outline:0;box-shadow:3px 3px 0 rgba(22,36,60,.14);transition:.2s}
#q:focus{border-color:var(--cyan);box-shadow:3px 3px 0 rgba(22,36,60,.16),0 0 0 3px rgba(8,126,164,.15)}
#q::placeholder{color:#8591a6}
.btn{border:1px solid #8d0c23;border-radius:6px;padding:10px 19px;font-weight:700;font-size:13px;letter-spacing:.4px;color:#fff;cursor:pointer;background:var(--pink);box-shadow:2px 3px 0 rgba(22,36,60,.18);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:2px 4px 0 rgba(22,36,60,.25);background:#ad102c}
.btn.ghost{background:#fff;color:#263650;box-shadow:2px 2px 0 rgba(22,36,60,.12);border:1px solid #34415a;font-weight:600;padding:9px 14px;font-size:12px}
.btn.ghost:hover{background:#f0f5fb;box-shadow:2px 3px 0 rgba(22,36,60,.18)}
.chips{display:none;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
body[data-view=home] .chips{display:flex}
.chip{border:1px solid #aab8c9;background:#f7fbff;color:#41516a;border-radius:5px;padding:7px 12px;font-size:12px;cursor:pointer;box-shadow:1px 2px 0 rgba(22,36,60,.1);transition:.2s}
.chip:hover{color:#14213a;border-color:var(--cyan);box-shadow:2px 3px 0 rgba(22,36,60,.15)}

main{max-width:960px;margin:0 auto;padding:0 16px 40px}
body[data-view=stage] main{max-width:1200px;padding:0 16px 12px}

/* ---------- results ---------- */
#results{display:none;gap:10px;grid-template-columns:1fr}
body[data-view=results] #results{display:grid}
.card{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:7px;background:#f8fbff;border:1px solid #263650;box-shadow:3px 4px 0 rgba(22,36,60,.15);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:4px 6px 0 rgba(22,36,60,.19)}
.disc{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#f8fbff 0 14%,transparent 15%),conic-gradient(from 0deg,#24314c,#c91232,#24314c,#087ea4,#24314c);box-shadow:0 2px 4px rgba(22,36,60,.22)}
.card:hover .disc{animation:spin 2s linear infinite}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{color:var(--dim);font-size:13px}
.sing{padding:9px 18px;font-size:13px}
.skel{height:70px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,255,255,.72),rgba(255,255,255,.25));background-size:200% 100%;animation:shine 1.2s linear infinite;box-shadow:3px 4px 0 rgba(22,36,60,.12)}
@keyframes shine{to{background-position:-200% 0}}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- stage ---------- */
#stage{display:none;flex-direction:column;min-height:540px;padding:12px;border:1px solid #1b2945;border-radius:10px;background:#f8fbff;box-shadow:5px 7px 0 rgba(22,36,60,.2)}
body[data-view=stage] #stage{display:flex}
#stage:fullscreen{background:#e9f7fc;padding:16px;height:100dvh}
.stagebar{display:flex;align-items:center;gap:12px;padding:4px 0 10px;border-bottom:1px solid #d8e1ec;margin-bottom:10px}
.now{flex:1;min-width:0}
.now b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{color:var(--dim);font-size:13px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:4px;height:5px;background:linear-gradient(var(--cyan),var(--pink));border-radius:1px}
body.playing .eq i{animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{to{height:22px}}
.grid{height:min(56vh,560px);min-height:360px;display:grid;grid-template-columns:1fr 330px;gap:16px}
#lyricsWrap{position:relative;min-height:0;border-radius:5px;border:1px solid #d1d9e5;background:#1a2439;overflow:hidden;box-shadow:inset 0 0 0 4px #202d47,inset 0 0 0 5px rgba(255,255,255,.1)}
#lyrics{position:absolute;inset:0;overflow:hidden;text-align:center;padding:0 18px;
  -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#lyrics .pad{height:42%}
.line{font-weight:700;font-size:clamp(24px,4.4vw,50px);line-height:1.2;padding:12px 6px;color:rgba(238,244,255,.42);transition:color .3s,transform .3s;cursor:pointer;transform-origin:center}
.line:hover{color:rgba(255,255,255,.78)}
.line.past{color:rgba(238,244,255,.22)}
.line.on{transform:scale(1.07);color:transparent;
  background:linear-gradient(90deg,#f4cf67 calc(var(--p,0)*100%),#f7fbff calc(var(--p,0)*100%));
  -webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 rgba(244,207,103,.18))}
#count{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:28px;color:#f4c845;text-shadow:0 2px 8px rgba(244,200,69,.35);letter-spacing:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2;min-height:44px}
#count.show{opacity:1}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#aab5ca;font-size:15px;text-align:center;padding:30px;z-index:1}
#hint:empty{display:none}
aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
#tv{border-radius:5px;overflow:hidden;border:3px solid #17233b;box-shadow:inset 0 0 0 2px #f4c845,3px 4px 0 rgba(22,36,60,.18);background:#101727;aspect-ratio:16/9;position:relative;flex:none}
#ytbox{position:absolute;inset:0;display:none}
#ytbox iframe,#ytbox>div{width:100%;height:100%;display:block}
body[data-mode=yt] #ytbox{display:block}
#vinyl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 44%,#263754,#111a2c)}
body[data-mode=yt] #vinyl{display:none}
#vinyl .disc{width:96px;height:96px}
body.playing #vinyl .disc{animation:spin 2.4s linear infinite}
.panel{background:#eef2ff;border:1px solid #273550;border-radius:5px;padding:12px;font-size:13px;box-shadow:2px 3px 0 rgba(22,36,60,.12)}
.panel h4{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--pink)}
#status{color:#53627b;margin-bottom:6px}
#status:empty{display:none}
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid #c5cedd;background:#fff;color:#24324c;border-radius:4px;padding:6px;cursor:pointer;font-size:12px;transition:.2s}
.ver img{width:56px;height:32px;object-fit:cover;border-radius:6px;flex:none}
.ver span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ver:hover,.ver.sel{border-color:var(--pink);box-shadow:2px 2px 0 rgba(201,18,50,.2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#ytlink{width:100%;margin-top:8px;padding:9px 12px;border-radius:4px;border:1px solid #9caac0;background:#fff;color:#24324c;font-size:13px;outline:0}
.fine{color:var(--dim);font-size:11px;margin:8px 0 0;line-height:1.4}

#bar{margin-top:10px;border-radius:5px;background:#e8edff;border:1px solid #263650;padding:10px 13px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 16px;align-items:center;box-shadow:2px 3px 0 rgba(22,36,60,.12)}
#play{width:52px;height:48px;border-radius:5px;border:1px solid #8e1027;color:#fff;font-size:20px;cursor:pointer;background:var(--pink);box-shadow:2px 3px 0 rgba(22,36,60,.17);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#play:hover{transform:scale(1.07)}
body:not(.playing) #play{animation:none}
@keyframes pulse{50%{box-shadow:2px 3px 0 rgba(22,36,60,.17)}}
.seekcol{display:flex;flex-direction:column;gap:4px;min-width:0}
#seek{width:100%;accent-color:var(--cyan);height:6px}
.times{display:flex;justify-content:space-between;color:#596780;font-family:var(--mono);font-size:11px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sync{display:flex;align-items:center;gap:6px;color:#596780;font-family:var(--mono);font-size:11px}
.sync .btn.ghost{padding:7px 11px}
#vol{width:80px;accent-color:var(--pink)}

button:focus-visible,input:focus-visible{outline:3px solid rgba(8,126,164,.45);outline-offset:2px}

@media(max-width:860px){
  .grid{height:auto;min-height:0;grid-template-columns:1fr;grid-template-rows:auto minmax(300px,44vh)}
  aside{order:-1;flex-direction:row;overflow:visible;min-height:0}
  #tv{width:min(32vw,220px);min-width:130px;aspect-ratio:16/9;flex:none}
  aside .panel{flex:1;min-width:0;max-height:150px;overflow:auto}
  #bar{grid-template-columns:auto 1fr}
  .tools{grid-column:1/-1;justify-content:center}
}
@media(max-width:520px){ #tv{width:100px;min-width:100px} aside{gap:7px} aside .panel{max-height:120px;padding:8px} .fine{display:none} .ver img{width:42px;height:26px} .sing{display:none} #vol{display:none} #stage{min-height:0;padding:8px} .stagebar{gap:7px} .stagebar>.btn{padding:7px 9px} .grid{grid-template-rows:auto minmax(240px,36vh)} #lyrics{padding:0 10px} #lyrics .pad{height:35%} .line{font-size:clamp(21px,7vw,32px);padding:9px 4px} #bar{gap:7px;padding:8px;margin-top:8px} #play{width:40px;height:40px} .tools{gap:5px} .sync{gap:4px} .sync .btn.ghost{padding:6px 8px} }
audio{display:none}
</style>
</head>
<body data-view="home" data-mode="none">
<div class="lights"><div class="beam"></div><div class="beam b2"></div><div class="stars"></div></div>

<div id="top">
  <h1 class="logo" id="logo"><span class="a">Kara</span><span class="b">Okay</span></h1>
  <p class="tag">Pick a song. Grab the mic. Let the lyrics light the way. 🎤</p>
  <form id="sf" autocomplete="off">
    <input id="q" type="text" placeholder="Search a song or artist…" aria-label="Search songs">
    <button class="btn" type="submit">Search</button>
  </form>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div id="results"></div>

  <section id="stage">
    <div class="stagebar">
      <button class="btn ghost" id="back">← Songs</button>
      <div class="now"><b id="tTitle"></b><span id="tArtist"></span></div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="grid">
      <div id="lyricsWrap">
        <div id="count"></div>
        <div id="hint"></div>
        <div id="lyrics"></div>
      </div>
      <aside>
        <div id="tv">
          <div id="vinyl"><div class="disc"></div></div>
          <div id="ytbox"><div id="ytp"></div></div>
        </div>
        <div class="panel">
          <h4>Backing track</h4>
          <div id="status"></div>
          <div class="vers" id="vers"></div>
          <div class="row">
            <button class="btn ghost" id="audiusBtn" style="display:none">Original (Audius)</button>
          </div>
          <input id="ytlink" type="text" placeholder="Paste a YouTube link, press Enter">
          <p class="fine">Video plays through YouTube's embedded player, so YouTube may show ads. Audius tracks are ad-free.</p>
        </div>
      </aside>
    </div>
    <div id="bar">
      <button id="play" aria-label="Play">▶</button>
      <div class="seekcol">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <div class="times"><span id="tNow">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="tools">
        <div class="sync">
          <button class="btn ghost" id="m" title="Lyrics earlier">−</button>
          <span id="off">0.0s</span>
          <button class="btn ghost" id="p" title="Lyrics later">+</button>
          <button class="btn ghost" id="syncnow" title="Press when the first lyric should appear">🎯 First line now</button>
        </div>
        <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
        <button class="btn ghost" id="fs" title="Fullscreen">⛶</button>
      </div>
    </div>
  </section>
</main>
<audio id="audio" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), APP = 'karaokay';
const S = { track: null, lines: [], active: -1, offset: 0, mode: 'none', yt: null, ytReady: null, ytPlayerReady: false, ytVideoId: '', ytTried: new Set(), ytHasCue: false, srcKey: '', dragging: false, versions: [], audiusUrl: null };
const dec = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const fmt = s => { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const setView = v => document.body.dataset.view = v;
const setMode = m => { S.mode = m; document.body.dataset.mode = m; };
const setStatus = t => $('status').textContent = t || '';

/* ---------- home ---------- */
['Dancing Queen', 'Bohemian Rhapsody', "Don't Stop Believin'", 'Shallow', 'Perfect', 'Mr. Brightside', 'Total Eclipse of the Heart'].forEach(s => {
  const c = document.createElement('button'); c.className = 'chip'; c.type = 'button'; c.textContent = s; c.onclick = () => search(s); $('chips').appendChild(c);
});
$('logo').onclick = () => { stopAll(); setView('home'); };
$('back').onclick = () => { stopAll(); setView($('results').children.length ? 'results' : 'home'); };
$('sf').onsubmit = e => { e.preventDefault(); search($('q').value); };

/* ---------- search (LRCLIB: open database of synced lyrics) ---------- */
async function search(q) {
  q = (q || '').trim(); if (!q) return;
  $('q').value = q; stopAll(); setView('results');
  $('results').innerHTML = '<div class="skel"></div>'.repeat(6);
  try {
    let r;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(q));
        if (r.ok) break;
      } catch (error) {
        if (attempt === 2) throw error;
      }
      if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
    }
    if (!r || !r.ok) throw new Error('Lyrics search failed');
    const seen = new Set(), list = [];
    for (const x of await r.json()) {
      if (!x.syncedLyrics || x.instrumental) continue;
      const k = (x.trackName + '|' + x.artistName).toLowerCase();
      if (seen.has(k)) continue; seen.add(k); list.push(x);
      if (list.length >= 24) break;
    }
    const box = $('results'); box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div class="empty">No songs with synced lyrics found. Try a different search 🎶</div>'; return; }
    for (const t of list) {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = '<div class="disc"></div><div class="meta"><b></b><span></span></div><div class="dur"></div><button class="btn sing">Sing ▶</button>';
      c.querySelector('b').textContent = t.trackName;
      c.querySelector('span').textContent = t.artistName + (t.albumName ? ' · ' + t.albumName : '');
      c.querySelector('.dur').textContent = fmt(t.duration);
      c.onclick = () => openTrack(t);
      box.appendChild(c);
    }
  } catch (e) { $('results').innerHTML = '<div class="empty">Search failed. Check your connection and try again.</div>'; }
}

/* ---------- lyrics ---------- */
function parseLRC(txt) {
  const out = [];
  for (const raw of txt.split('\n')) {
    const m = raw.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)\s*(.*)$/); if (!m) continue;
    for (const t of m[1].matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)) out.push({ t: +t[1] * 60 + +t[2], text: m[2].trim() || '♪' });
  }
  return out.sort((a, b) => a.t - b.t);
}
function renderLyrics() {
  const box = $('lyrics'); box.innerHTML = '<div class="pad"></div>';
  S.lines.forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'line'; d.id = 'l' + i; d.textContent = l.text;
    d.onclick = () => seekTo(l.t - S.offset); box.appendChild(d);
  });
  box.insertAdjacentHTML('beforeend', '<div class="pad"></div>');
  S.active = -1; box.scrollTop = 0;
}
function showOffset() { $('off').textContent = (S.offset >= 0 ? '+' : '') + S.offset.toFixed(1) + 's'; }
function setOffset(v) { S.offset = Math.round(v * 10) / 10; showOffset(); if (S.track && S.srcKey) store.set('kk:off:' + S.track.id + ':' + S.srcKey, S.offset); }
function loadOffset() { const v = parseFloat(store.get('kk:off:' + S.track.id + ':' + S.srcKey)); S.offset = isNaN(v) ? 0 : v; showOffset(); }

/* ---------- open a song & find backing tracks ---------- */
async function openTrack(t) {
  stopAll(); S.track = t; S.srcKey = ''; S.versions = []; S.audiusUrl = null; S.ytTried = new Set(); S.ytVideoId = ''; S.offset = 0; showOffset();
  S.lines = parseLRC(t.syncedLyrics);
  $('tTitle').textContent = t.trackName; $('tArtist').textContent = t.artistName;
  renderLyrics(); renderSources(); setMode('none'); setView('stage');
  $('hint').textContent = 'Finding a backing track…'; setStatus('Looking for a karaoke version…');
  const my = t.id;
  const [yt, au] = await Promise.allSettled([findYT(t), findAudius(t)]);
  if (!S.track || S.track.id !== my) return;
  S.versions = yt.status === 'fulfilled' ? yt.value : [];
  S.audiusUrl = au.status === 'fulfilled' ? au.value : null;
  renderSources();
  if (S.versions.length) return useYT(S.versions[0].id);
  if (S.audiusUrl) return useAudius(true);
  setStatus('No playable backing track was found for this song. Try another search result or paste a YouTube link.');
  $('hint').textContent = 'This song is currently unavailable. Add another backing track to continue ➜';
}
async function findYT(t) {
  const r = await fetch('/api/youtube?q=' + encodeURIComponent(t.trackName + ' ' + t.artistName));
  if (!r.ok) return [];
  const isKaraoke = /\b(karaoke|instrumental|minus[ -]?one|backing track|no vocals?|vocals? removed)\b/i;
  return ((await r.json()).items || [])
    .map(i => ({ id: i.id, title: dec(i.title), channel: i.channel || '', thumb: i.thumb }))
    .filter(i => isKaraoke.test(i.title + ' ' + i.channel));
}
async function findAudius(t) {
  const r = await fetch('https://api.audius.co/v1/tracks/search?app_name=' + APP + '&query=' + encodeURIComponent(t.trackName + ' ' + t.artistName));
  const key = t.trackName.toLowerCase().split(/[\s(\-]/)[0];
  const hit = ((await r.json()).data || []).find(x => Math.abs(x.duration - t.duration) < 6 && x.title.toLowerCase().includes(key));
  return hit ? `https://api.audius.co/v1/tracks/${hit.id}/stream?app_name=${APP}` : null;
}
function renderSources() {
  const box = $('vers'); box.innerHTML = '';
  S.versions.forEach(v => {
    const b = document.createElement('button'); b.className = 'ver' + (S.srcKey === 'yt:' + v.id ? ' sel' : ''); b.type = 'button';
    b.innerHTML = '<img alt=""><span></span>'; b.querySelector('img').src = v.thumb || ''; b.querySelector('span').textContent = v.title;
    b.onclick = () => useYT(v.id); box.appendChild(b);

function ready(key) { S.srcKey = key; loadOffset(); renderSources(); setStatus(''); $('hint').textContent = 'Press ▶ to start the music'; }
function useYT(id) {

  try { S.yt && S.yt.destroy && S.yt.destroy(); } catch (error) {}

  const freshHost = document.createElement('div'); freshHost.id = 'ytp-next';

      events: {

function useAudius(karaokeUnavailable = false) {

  if (karaokeUnavailable) setStatus('No karaoke or minus-one track was found. Playing the original Audius track instead.');

$('audiusBtn').onclick = () => S.audiusUrl && useAudius();
$('ytlink').onkeydown = e => {

  S.versions = S.versions.filter(v => v.id !== m[1]); S.versions.unshift({ id: m[1], title: 'Your link', thumb: `https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg` });
  useYT(m[1]); e.target.value = '';
};
audio.onerror = () => {
  if (!audio.getAttribute('src')) return;
  stopAll(); setMode('none');
  setStatus('This song is unavailable: the audio track could not be played. Choose another version or paste a YouTube link.');
  $('hint').textContent = 'No playable backing track is available for this song.';
};
audio.onended = () => ended();
function ended() { $('count').textContent = '🎉 Encore!'; $('count').classList.add('show'); }

/* ---------- transport ---------- */
const ytOK = () => S.ytPlayerReady && S.yt && S.yt.getPlayerState;
const now = () => S.mode === 'yt' ? (ytOK() ? S.yt.getCurrentTime() : 0) : audio.currentTime;
const dur = () => S.mode === 'yt' ? (ytOK() ? S.yt.getDuration() : 0) : (audio.duration || (S.track && S.track.duration) || 0);

        const requestedId = S.ytVideoId;
        setStatus('Starting backing track…'); S.yt.playVideo();
        clearTimeout(S.ytStartTimer);
        S.ytStartTimer = setTimeout(() => {

function seekTo(sec) {

}
function stopYT() { try { S.yt && S.yt.pauseVideo && S.yt.pauseVideo(); } catch (e) {} }
function stopAll() { audio.pause(); stopYT(); document.body.classList.remove('playing'); $('count').classList.remove('show'); }
$('play').onclick = togglePlay;
['pointerdown', 'touchstart'].forEach(ev => $('seek').addEventListener(ev, () => S.dragging = true, { passive: true }));
['pointerup', 'touchend', 'change'].forEach(ev => $('seek').addEventListener(ev, () => S.dragging = false));
$('seek').oninput = e => seekTo(e.target.value / 1000 * dur());
$('m').onclick = () => setOffset(S.offset - .5);
$('p').onclick = () => setOffset(S.offset + .5);
$('syncnow').onclick = () => { if (S.lines.length && S.mode !== 'none') setOffset(S.lines[0].t - now()); };
$('vol').oninput = e => { const v = e.target.value / 100; audio.volume = v; try { S.yt && S.yt.setVolume && S.yt.setVolume(v * 100); } catch (x) {} };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : ($('stage').requestFullscreen && $('stage').requestFullscreen());
document.addEventListener('keydown', e => {
  if (document.body.dataset.view !== 'stage' || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') seekTo(now() + 5);
  else if (e.code === 'ArrowLeft') seekTo(now() - 5);
});

/* ---------- sync loop ---------- */
function tick() {
  if (document.body.dataset.view === 'stage') {
    const L = S.lines, t = now() + S.offset;
    let i = -1; for (let k = 0; k < L.length && L[k].t <= t; k++) i = k;
    if (i !== S.active) {
      S.active = i;
      for (let k = 0; k < L.length; k++) { const el = $('l' + k); const c = k === i ? 'line on' : k < i ? 'line past' : 'line'; if (el.className !== c) el.className = c; }

    }

tick();
