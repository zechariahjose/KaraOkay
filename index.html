<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaraOkay — sing along to anything</title>
<meta name="description" content="Search a song, grab the mic, and sing along with synced lyrics.">
<meta name="theme-color" content="#09011a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09011a; --panel:rgba(26,8,56,.72); --line:rgba(255,255,255,.12);
  --pink:#ff2bd6; --cyan:#00f0ff; --yellow:#ffe45e; --purple:#7b2cff; --text:#fff; --dim:rgba(255,255,255,.55);
  --font:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;overflow-x:hidden}
button,input{font-family:inherit}

/* ---------- stage lights ---------- */
.lights{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(900px 500px at 50% 110%,rgba(123,44,255,.45),transparent 70%),radial-gradient(700px 400px at 10% 0%,rgba(255,43,214,.18),transparent 70%),var(--bg)}
.beam{position:absolute;top:-20%;left:50%;width:160vmax;height:160vmax;margin-left:-80vmax;transform-origin:50% 12%;opacity:.5;filter:blur(18px);
  background:conic-gradient(from 180deg at 50% 12%,transparent 0 40%,rgba(255,43,214,.28) 42% 44%,transparent 46% 54%,rgba(0,240,255,.25) 56% 58%,transparent 60% 100%);
  animation:sway 11s ease-in-out infinite alternate}
.beam.b2{animation-duration:15s;animation-direction:alternate-reverse;opacity:.35}
@keyframes sway{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent);opacity:.5;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.15}}

/* ---------- header / logo ---------- */
#top{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;transition:padding .3s}
body[data-view=home] #top{padding:13vh 16px 24px}
.logo{font-family:'Monoton',var(--font);font-size:30px;line-height:1;margin:0;cursor:pointer;letter-spacing:2px;user-select:none;transition:font-size .3s;white-space:nowrap}
.logo .a{color:#ffd6f7;text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 56px var(--pink)}
.logo .b{color:#d6fdff;text-shadow:0 0 4px #fff,0 0 12px var(--cyan),0 0 28px var(--cyan),0 0 56px var(--cyan);animation:flicker 7s infinite}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
body[data-view=home] .logo{font-size:clamp(46px,11vw,92px)}
.tag{margin:0;color:var(--dim);font-size:clamp(14px,2.4vw,18px);text-align:center;display:none}
body[data-view=home] .tag{display:block}
#sf{display:flex;gap:8px;width:100%;max-width:640px}
body[data-view=stage] #sf,body[data-view=stage] .chips{display:none}
#q{flex:1;min-width:0;padding:15px 20px;border-radius:999px;border:2px solid var(--pink);background:rgba(10,0,30,.75);color:#fff;font-size:16px;outline:0;box-shadow:0 0 18px rgba(255,43,214,.45),inset 0 0 14px rgba(255,43,214,.15);transition:.2s}
#q:focus{border-color:var(--cyan);box-shadow:0 0 24px rgba(0,240,255,.55),inset 0 0 14px rgba(0,240,255,.15)}
#q::placeholder{color:rgba(255,255,255,.4)}
.btn{border:0;border-radius:999px;padding:0 24px;font-weight:800;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--pink),var(--purple));box-shadow:0 0 18px rgba(255,43,214,.5);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 0 28px rgba(255,43,214,.8)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);font-weight:600;padding:9px 16px;font-size:13px}
.btn.ghost:hover{background:rgba(255,255,255,.16);box-shadow:none}
.chips{display:none;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
body[data-view=home] .chips{display:flex}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--dim);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 14px rgba(0,240,255,.4)}

main{max-width:880px;margin:0 auto;padding:0 16px 40px}
body[data-view=stage] main{max-width:1200px;padding:0 16px 12px}

/* ---------- results ---------- */
#results{display:none;gap:10px;grid-template-columns:1fr}
body[data-view=results] #results{display:grid}
.card{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);cursor:pointer;transition:.2s}
.card:hover{transform:translateX(4px);border-color:var(--pink);box-shadow:0 0 22px rgba(255,43,214,.35)}
.disc{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#09011a 0 14%,transparent 15%),conic-gradient(from 0deg,#2a0a5e,#ff2bd6,#2a0a5e,#00f0ff,#2a0a5e);box-shadow:0 0 14px rgba(255,43,214,.4)}
.card:hover .disc{animation:spin 2s linear infinite}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{color:var(--dim);font-size:13px}
.sing{padding:9px 18px;font-size:13px}
.skel{height:70px;border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shine 1.2s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- stage ---------- */
#stage{display:none;flex-direction:column;height:calc(100dvh - 76px);min-height:480px}
body[data-view=stage] #stage{display:flex}
#stage:fullscreen{background:var(--bg);padding:16px;height:100dvh}
.stagebar{display:flex;align-items:center;gap:12px;padding:4px 0 10px}
.now{flex:1;min-width:0}
.now b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{color:var(--dim);font-size:13px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:4px;height:5px;background:linear-gradient(var(--cyan),var(--pink));border-radius:2px}
body.playing .eq i{animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{to{height:22px}}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px;gap:16px}
#lyricsWrap{position:relative;min-height:0;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,4,50,.7),rgba(10,0,30,.55));overflow:hidden;box-shadow:inset 0 0 60px rgba(123,44,255,.2)}
#lyrics{position:absolute;inset:0;overflow:hidden;text-align:center;padding:0 18px;
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
#lyrics .pad{height:42%}
.line{font-weight:800;font-size:clamp(24px,4.4vw,50px);line-height:1.2;padding:12px 6px;color:rgba(255,255,255,.4);transition:color .3s,transform .3s;cursor:pointer;transform-origin:center}
.line:hover{color:rgba(255,255,255,.75)}
.line.past{color:rgba(255,255,255,.2)}
.line.on{transform:scale(1.07);color:transparent;
  background:linear-gradient(90deg,var(--yellow) calc(var(--p,0)*100%),#fff calc(var(--p,0)*100%));
  -webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px rgba(255,43,214,.7))}
#count{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:34px;color:var(--cyan);text-shadow:0 0 18px var(--cyan);letter-spacing:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2;min-height:44px}
#count.show{opacity:1}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--dim);font-size:15px;text-align:center;padding:30px;z-index:1}
#hint:empty{display:none}
aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
#tv{border-radius:20px;overflow:hidden;border:2px solid var(--cyan);box-shadow:0 0 22px rgba(0,240,255,.4);background:#000;aspect-ratio:16/9;position:relative;flex:none}
#ytbox{position:absolute;inset:0;display:none}
#ytbox iframe,#ytbox>div{width:100%;height:100%;display:block}
body[data-mode=yt] #ytbox{display:block}
#vinyl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2a0a5e,#09011a)}
body[data-mode=yt] #vinyl{display:none}
#vinyl .disc{width:96px;height:96px}
body.playing #vinyl .disc{animation:spin 2.4s linear infinite}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;font-size:13px}
.panel h4{margin:0 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan)}
#status{color:var(--dim);margin-bottom:6px}
#status:empty{display:none}
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;border-radius:12px;padding:6px;cursor:pointer;font-size:12px;transition:.2s}
.ver img{width:56px;height:32px;object-fit:cover;border-radius:6px;flex:none}
.ver span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ver:hover,.ver.sel{border-color:var(--pink);box-shadow:0 0 12px rgba(255,43,214,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#ytlink{width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font-size:13px;outline:0}
.fine{color:var(--dim);font-size:11px;margin:8px 0 0;line-height:1.4}

#bar{margin-top:12px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 16px;align-items:center}
#play{width:60px;height:60px;border-radius:50%;border:0;color:#fff;font-size:24px;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 0 22px rgba(255,43,214,.7);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#play:hover{transform:scale(1.07)}
body:not(.playing) #play{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,43,214,1)}}
.seekcol{display:flex;flex-direction:column;gap:4px;min-width:0}
#seek{width:100%;accent-color:var(--pink);height:6px}
.times{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sync{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.sync .btn.ghost{padding:7px 11px}
#vol{width:80px;accent-color:var(--cyan)}

@media(max-width:860px){
  .grid{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{order:-1;flex-direction:row;overflow:visible}
  #tv{width:140px;aspect-ratio:16/9;flex:none}
  aside .panel{flex:1;min-width:0;max-height:96px;overflow:auto}
  #bar{grid-template-columns:auto 1fr}
  .tools{grid-column:1/-1;justify-content:center}
  #stage{height:calc(100dvh - 60px)}
}
@media(max-width:520px){ #tv{display:none} aside .panel{max-height:120px} .sing{display:none} #vol{display:none} }
audio{display:none}
</style>
</head>
<body data-view="home" data-mode="none">
<div class="lights"><div class="beam"></div><div class="beam b2"></div><div class="stars"></div></div>

<div id="top">
  <h1 class="logo" id="logo"><span class="a">Kara</span><span class="b">Okay</span></h1>
  <p class="tag">Pick a song. Grab the mic. Let the lyrics light the way. 🎤</p>
  <form id="sf" autocomplete="off">
    <input id="q" type="text" placeholder="Search a song or artist…" aria-label="Search songs">
    <button class="btn" type="submit">Search</button>
  </form>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div id="results"></div>

  <section id="stage">
    <div class="stagebar">
      <button class="btn ghost" id="back">← Songs</button>
      <div class="now"><b id="tTitle"></b><span id="tArtist"></span></div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="grid">
      <div id="lyricsWrap">
        <div id="count"></div>
        <div id="hint"></div>
        <div id="lyrics"></div>
      </div>
      <aside>
        <div id="tv">
          <div id="vinyl"><div class="disc"></div></div>
          <div id="ytbox"><div id="ytp"></div></div>
        </div>
        <div class="panel">
          <h4>Backing track</h4>
          <div id="status"></div>
          <div class="vers" id="vers"></div>
          <div class="row">
            <button class="btn ghost" id="audiusBtn" style="display:none">Original (Audius)</button>
          </div>
          <input id="ytlink" type="text" placeholder="Paste a YouTube link, press Enter">
          <p class="fine">Video plays through YouTube's embedded player, so YouTube may show ads. Audius tracks are ad-free.</p>
        </div>
      </aside>
    </div>
    <div id="bar">
      <button id="play" aria-label="Play">▶</button>
      <div class="seekcol">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <div class="times"><span id="tNow">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="tools">
        <div class="sync">
          <button class="btn ghost" id="m" title="Lyrics earlier">−</button>
          <span id="off">0.0s</span>
          <button class="btn ghost" id="p" title="Lyrics later">+</button>
          <button class="btn ghost" id="syncnow" title="Press when the first lyric should appear">🎯 First line now</button>
        </div>
        <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
        <button class="btn ghost" id="fs" title="Fullscreen">⛶</button>
      </div>
    </div>
  </section>
</main>
<audio id="audio" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), APP = 'karaokay';
const S = { track: null, lines: [], active: -1, offset: 0, mode: 'none', yt: null, ytReady: null, srcKey: '', dragging: false, versions: [], audiusUrl: null };
const dec = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const fmt = s => { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const setView = v => document.body.dataset.view = v;
const setMode = m => { S.mode = m; document.body.dataset.mode = m; };
const setStatus = t => $('status').textContent = t || '';

/* ---------- home ---------- */
['Dancing Queen', 'Bohemian Rhapsody', "Don't Stop Believin'", 'Shallow', 'Perfect', 'Mr. Brightside', 'Total Eclipse of the Heart'].forEach(s => {
  const c = document.createElement('button'); c.className = 'chip'; c.type = 'button'; c.textContent = s; c.onclick = () => search(s); $('chips').appendChild(c);
});
$('logo').onclick = () => { stopAll(); setView('home'); };
$('back').onclick = () => { stopAll(); setView($('results').children.length ? 'results' : 'home'); };
$('sf').onsubmit = e => { e.preventDefault(); search($('q').value); };

/* ---------- search (LRCLIB: open database of synced lyrics) ---------- */
async function search(q) {
  q = (q || '').trim(); if (!q) return;
  $('q').value = q; stopAll(); setView('results');
  $('results').innerHTML = '<div class="skel"></div>'.repeat(6);
  try {
    const r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(q));
    if (!r.ok) throw 0;
    const seen = new Set(), list = [];
    for (const x of await r.json()) {
      if (!x.syncedLyrics || x.instrumental) continue;
      const k = (x.trackName + '|' + x.artistName).toLowerCase();
      if (seen.has(k)) continue; seen.add(k); list.push(x);
      if (list.length >= 24) break;
    }
    const box = $('results'); box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div class="empty">No songs with synced lyrics found. Try a different search 🎶</div>'; return; }
    for (const t of list) {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = '<div class="disc"></div><div class="meta"><b></b><span></span></div><div class="dur"></div><button class="btn sing">Sing ▶</button>';
      c.querySelector('b').textContent = t.trackName;
      c.querySelector('span').textContent = t.artistName + (t.albumName ? ' · ' + t.albumName : '');
      c.querySelector('.dur').textContent = fmt(t.duration);
      c.onclick = () => openTrack(t);
      box.appendChild(c);
    }
  } catch (e) { $('results').innerHTML = '<div class="empty">Search failed. Check your connection and try again.</div>'; }
}

/* ---------- lyrics ---------- */
function parseLRC(txt) {
  const out = [];
  for (const raw of txt.split('\n')) {
    const m = raw.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)\s*(.*)$/); if (!m) continue;
    for (const t of m[1].matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)) out.push({ t: +t[1] * 60 + +t[2], text: m[2].trim() || '♪' });
  }
  return out.sort((a, b) => a.t - b.t);
}
function renderLyrics() {
  const box = $('lyrics'); box.innerHTML = '<div class="pad"></div>';
  S.lines.forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'line'; d.id = 'l' + i; d.textContent = l.text;
    d.onclick = () => seekTo(l.t - S.offset); box.appendChild(d);
  });
  box.insertAdjacentHTML('beforeend', '<div class="pad"></div>');
  S.active = -1; box.scrollTop = 0;
}
function showOffset() { $('off').textContent = (S.offset >= 0 ? '+' : '') + S.offset.toFixed(1) + 's'; }
function setOffset(v) { S.offset = Math.round(v * 10) / 10; showOffset(); if (S.track && S.srcKey) store.set('kk:off:' + S.track.id + ':' + S.srcKey, S.offset); }
function loadOffset() { const v = parseFloat(store.get('kk:off:' + S.track.id + ':' + S.srcKey)); S.offset = isNaN(v) ? 0 : v; showOffset(); }

/* ---------- open a song & find backing tracks ---------- */
async function openTrack(t) {
  stopAll(); S.track = t; S.srcKey = ''; S.versions = []; S.audiusUrl = null; S.offset = 0; showOffset();
  S.lines = parseLRC(t.syncedLyrics);
  $('tTitle').textContent = t.trackName; $('tArtist').textContent = t.artistName;
  renderLyrics(); renderSources(); setMode('none'); setView('stage');
  $('hint').textContent = 'Finding a backing track…'; setStatus('Looking for a karaoke version…');
  const my = t.id;
  const [yt, au] = await Promise.allSettled([findYT(t), findAudius(t)]);
  if (!S.track || S.track.id !== my) return;
  S.versions = yt.status === 'fulfilled' ? yt.value : [];
  S.audiusUrl = au.status === 'fulfilled' ? au.value : null;
  renderSources();
  if (S.versions.length) return useYT(S.versions[0].id);
  if (S.audiusUrl) return useAudius();
  setStatus('No automatic backing track found. Paste a YouTube karaoke link to keep singing.');
  $('hint').textContent = 'Add a backing track on the right to start singing ➜';
}
async function findYT(t) {
  const r = await fetch('/api/youtube?q=' + encodeURIComponent(t.trackName + ' ' + t.artistName));
  if (!r.ok) return [];
  return ((await r.json()).items || []).map(i => ({ id: i.id, title: dec(i.title), thumb: i.thumb }));
}
async function findAudius(t) {
  const r = await fetch('https://api.audius.co/v1/tracks/search?app_name=' + APP + '&query=' + encodeURIComponent(t.trackName + ' ' + t.artistName));
  const key = t.trackName.toLowerCase().split(/[\s(\-]/)[0];
  const hit = ((await r.json()).data || []).find(x => Math.abs(x.duration - t.duration) < 6 && x.title.toLowerCase().includes(key));
  return hit ? `https://api.audius.co/v1/tracks/${hit.id}/stream?app_name=${APP}` : null;
}
function renderSources() {
  const box = $('vers'); box.innerHTML = '';
  S.versions.forEach(v => {
    const b = document.createElement('button'); b.className = 'ver' + (S.srcKey === 'yt:' + v.id ? ' sel' : ''); b.type = 'button';
    b.innerHTML = '<img alt=""><span></span>'; b.querySelector('img').src = v.thumb || ''; b.querySelector('span').textContent = v.title;
    b.onclick = () => useYT(v.id); box.appendChild(b);
  });
  $('audiusBtn').style.display = S.audiusUrl ? '' : 'none';
}
function ready(key) { S.srcKey = key; loadOffset(); renderSources(); setStatus(''); $('hint').textContent = 'Press ▶ to start the music'; }
function useYT(id) {
  audio.pause(); audio.removeAttribute('src'); setMode('yt'); ready('yt:' + id);
  if (!S.ytReady) S.ytReady = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = res; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = rej; document.head.appendChild(s);
  });
  S.ytReady.then(() => {
    if (S.yt && S.yt.loadVideoById) return S.yt.loadVideoById(id);
    S.yt = new YT.Player('ytp', { videoId: id, width: '100%', height: '100%', playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: { onStateChange: e => { if (e.data === 0) ended(); else if (e.data === 1) $('hint').textContent = ''; } } });
  }).catch(() => setStatus('Could not load the YouTube player. Try a different video or paste another link.'));
}
function useAudius() { stopYT(); setMode('audio'); audio.src = S.audiusUrl; ready('audius'); }
$('audiusBtn').onclick = () => S.audiusUrl && useAudius();
$('ytlink').onkeydown = e => {
  if (e.key !== 'Enter') return;
  const m = e.target.value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if (!m) return setStatus('That does not look like a YouTube link.');
  S.versions = S.versions.filter(v => v.id !== m[1]); S.versions.unshift({ id: m[1], title: 'Your link', thumb: `https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg` });
  useYT(m[1]); e.target.value = '';
};
audio.onerror = () => { if (audio.getAttribute('src')) setStatus('That audio could not be played. Try another backing track.'); };
audio.onended = () => ended();
function ended() { $('count').textContent = '🎉 Encore!'; $('count').classList.add('show'); }

/* ---------- transport ---------- */
const ytOK = () => S.yt && S.yt.getPlayerState;
const now = () => S.mode === 'yt' ? (ytOK() ? S.yt.getCurrentTime() : 0) : audio.currentTime;
const dur = () => S.mode === 'yt' ? (ytOK() ? S.yt.getDuration() : 0) : (audio.duration || (S.track && S.track.duration) || 0);
const playing = () => S.mode === 'yt' ? (ytOK() && [1, 3].includes(S.yt.getPlayerState())) : (S.mode === 'audio' && !audio.paused);
function togglePlay() {
  if (S.mode === 'none') return;
  if (S.mode === 'yt') { if (ytOK()) playing() ? S.yt.pauseVideo() : S.yt.playVideo(); return; }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}
function seekTo(sec) {
  sec = Math.max(0, sec); if (S.mode === 'yt' && ytOK()) S.yt.seekTo(sec, true); else if (S.mode === 'audio') audio.currentTime = sec;
  $('count').classList.remove('show');
}
function stopYT() { try { S.yt && S.yt.pauseVideo && S.yt.pauseVideo(); } catch (e) {} }
function stopAll() { audio.pause(); stopYT(); document.body.classList.remove('playing'); $('count').classList.remove('show'); }
$('play').onclick = togglePlay;
['pointerdown', 'touchstart'].forEach(ev => $('seek').addEventListener(ev, () => S.dragging = true, { passive: true }));
['pointerup', 'touchend', 'change'].forEach(ev => $('seek').addEventListener(ev, () => S.dragging = false));
$('seek').oninput = e => seekTo(e.target.value / 1000 * dur());
$('m').onclick = () => setOffset(S.offset - .5);
$('p').onclick = () => setOffset(S.offset + .5);
$('syncnow').onclick = () => { if (S.lines.length && S.mode !== 'none') setOffset(S.lines[0].t - now()); };
$('vol').oninput = e => { const v = e.target.value / 100; audio.volume = v; try { S.yt && S.yt.setVolume && S.yt.setVolume(v * 100); } catch (x) {} };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : ($('stage').requestFullscreen && $('stage').requestFullscreen());
document.addEventListener('keydown', e => {
  if (document.body.dataset.view !== 'stage' || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') seekTo(now() + 5);
  else if (e.code === 'ArrowLeft') seekTo(now() - 5);
});

/* ---------- sync loop ---------- */
function tick() {
  if (document.body.dataset.view === 'stage') {
    const L = S.lines, t = now() + S.offset;
    let i = -1; for (let k = 0; k < L.length && L[k].t <= t; k++) i = k;
    if (i !== S.active) {
      S.active = i;
      for (let k = 0; k < L.length; k++) { const el = $('l' + k); const c = k === i ? 'line on' : k < i ? 'line past' : 'line'; if (el.className !== c) el.className = c; }
      const el = i >= 0 && $('l' + i), box = $('lyrics');
      if (el) box.scrollTo({ top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2, behavior: 'smooth' });
    }
    if (i >= 0) { const end = L[i + 1] ? L[i + 1].t : L[i].t + 4; $('l' + i).style.setProperty('--p', Math.min(1, Math.max(0, (t - L[i].t) / Math.max(.3, end - L[i].t) * 1.05)).toFixed(3)); }
    const nx = L[i + 1], c = $('count');
    if (nx && nx.t - t > 0 && nx.t - t <= 3 && (i < 0 || nx.t - L[i].t > 8)) { c.textContent = '● '.repeat(Math.ceil(nx.t - t)).trim(); c.classList.add('show'); }
    else if (!c.textContent.includes('Encore') || playing()) { c.classList.remove('show'); }
    const d = dur(), p = playing();
    if (d && !S.dragging) $('seek').value = now() / d * 1000;
    $('tNow').textContent = fmt(now()); $('tDur').textContent = fmt(d);
    $('play').textContent = p ? '❚❚' : '▶';
    document.body.classList.toggle('playing', !!p);
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
